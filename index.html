<!DOCTYPE html>
<html lang="en-NZ">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AT Network Comms Studio</title>
  <script>
    // Apply the saved theme before the page draws, so there is no flash.
    (function () { try { var t = localStorage.getItem('ncs-theme'); if (['light', 'dark', 'command', 'cyber', 'gta'].indexOf(t) < 0) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', t); } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); } })();
  </script>
  <style>
    /* ===== Theme tokens ===== */
    :root, [data-theme="light"] {
      color-scheme: light;
      --bg: #f3f4f7;
      --bg2: #eceef2;
      --card: #ffffff;
      --raised: #f8f9fb;
      --ink: #1d2330;
      --ink2: #3a4252;
      --mut: #6a7385;
      --line: #e3e6ec;
      --line2: #d3d8e1;
      --acc: #3462c9;
      --acc-ink: #ffffff;
      --acc2: #e9effb;
      --acc3: #d6e1f7;
      --ok: #1f7a55;
      --okb: #e5f3ec;
      --err: #b5372f;
      --errb: #fbecea;
      --warn: #8a5a0a;
      --warnb: #fbf3e2;
      --warnl: #f0dfb8;
      --hdr: rgba(255, 255, 255, .86);
      --EW: #c8373b;
      --SC: #d98a12;
      --OW: #7448b8;
      --r: 12px;
      --r2: 9px;
      --sh: 0 1px 2px rgba(25, 32, 48, .04), 0 2px 10px rgba(25, 32, 48, .04);
      --sh2: 0 14px 40px rgba(25, 32, 48, .16);
      --focus: 0 0 0 3px rgba(52, 98, 201, .22);
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #14171d;
      --bg2: #1a1e25;
      --card: #1c2028;
      --raised: #222731;
      --ink: #e3e6ec;
      --ink2: #c4c9d3;
      --mut: #959eae;
      --line: #2b313c;
      --line2: #3a4250;
      --acc: #7ea3ee;
      --acc-ink: #10151f;
      --acc2: #222d42;
      --acc3: #2c3a56;
      --ok: #6cc59a;
      --okb: #1b2c25;
      --err: #ee8a82;
      --errb: #34201f;
      --warn: #e5bd6a;
      --warnb: #2c2619;
      --warnl: #463a20;
      --hdr: rgba(24, 27, 34, .88);
      --EW: #e0605f;
      --SC: #e9a33c;
      --OW: #9c7ad8;
      --sh: 0 1px 2px rgba(0, 0, 0, .25);
      --sh2: 0 16px 44px rgba(0, 0, 0, .5);
      --focus: 0 0 0 3px rgba(126, 163, 238, .28);
    }
    * { box-sizing: border-box }
    html { background: var(--bg) }
    body {
      margin: 0;
      font: 14px/1.55 "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      transition: background-color .2s, color .2s
    }
    ::selection { background: var(--acc3) }
    code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; background: var(--bg2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px }

    /* ===== Header ===== */
    header {
      position: sticky; top: 0; z-index: 20;
      background: var(--hdr);
      backdrop-filter: saturate(160%) blur(10px);
      -webkit-backdrop-filter: saturate(160%) blur(10px);
      border-bottom: 1px solid var(--line)
    }
    .bar { max-width: 1500px; margin: auto; padding: 10px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap }
    .brand { font-weight: 700; font-size: 15px; display: flex; flex-direction: column; line-height: 1.25; letter-spacing: .005em; color: var(--ink); padding-right: 6px }
    .brand span { font-weight: 500; font-size: 11.5px; color: var(--mut) }
    nav { display: flex; align-items: center; flex: 1; flex-wrap: wrap; gap: 14px }
    .tabs, .tools { display: flex; align-items: center; gap: 2px; background: var(--bg2); border: 1px solid var(--line); padding: 3px; border-radius: 11px }
    .tools { background: transparent; border-color: transparent; padding: 0 }
    nav button {
      border: 0; background: none; padding: 7px 15px; border-radius: 8px;
      font: inherit; font-size: 13.5px; font-weight: 600; color: var(--mut); cursor: pointer;
      transition: background-color .15s, color .15s
    }
    nav button:hover { color: var(--ink) }
    .tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 0 0 1px var(--line) }
    nav button.tool { font-weight: 500; font-size: 13px; padding: 7px 11px }
    nav button.tool.on { color: var(--acc); background: var(--acc2) }
    nav .sep { flex: 1 }
    .selfcheck { max-width: 1500px; margin: 16px auto 0; padding: 0 24px }
    .selfcheck div { background: var(--errb); color: var(--err); border: 1px solid var(--err); border-radius: var(--r); padding: 12px 16px; font-weight: 600 }
    .theme {
      display: inline-flex; align-items: center; gap: 9px; border: 1px solid var(--line); background: var(--card);
      color: var(--ink2); border-radius: 999px; padding: 5px 6px 5px 12px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer
    }
    .theme:hover { border-color: var(--line2) }
    .theme .sw { position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--bg2); border: 1px solid var(--line2); transition: background-color .2s }
    .theme .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--mut); transition: transform .2s, background-color .2s }
    [data-theme="dark"] .theme .sw { background: var(--acc3); border-color: var(--acc) }
    [data-theme="dark"] .theme .sw::after { transform: translateX(14px); background: var(--acc) }

      .theme-pick { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-size: 12px; font-weight: 600; color: var(--mut) }
      .theme-pick select { width: auto; padding: 6px 30px 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--ink2) }

      /* ===== Command centre theme: deep navy, steel blue, compact, small-caps labels, fixed-width figures ===== */
      [data-theme="command"] {
        color-scheme: dark;
        --bg: #0a1220; --bg2: #0f192c; --card: #111b2e; --raised: #15213a; --ink: #dbe4f2; --ink2: #b9c6dc; --mut: #8394b2;
        --line: #1e2b44; --line2: #2a3a58; --acc: #4f9dff; --acc-ink: #06101f; --acc2: #13274a; --acc3: #1b3562;
        --ok: #4fd39a; --okb: #0f2a22; --err: #ff7b72; --errb: #2e1518; --warn: #ffbf5a; --warnb: #2a2112; --warnl: #4a3a1a;
        --hdr: rgba(8, 14, 26, .94); --EW: #ff5d5d; --SC: #ffb03b; --OW: #b48cff; --r: 8px; --r2: 6px;
        --sh: 0 0 0 1px rgba(79, 157, 255, .04), 0 2px 8px rgba(0, 0, 0, .35); --sh2: 0 16px 44px rgba(0, 0, 0, .6); --focus: 0 0 0 3px rgba(79, 157, 255, .3);
      }
      [data-theme="command"] body { background: radial-gradient(1200px 500px at 50% -200px, #12223f 0%, transparent 70%), var(--bg) }
      [data-theme="command"] header { border-bottom: 1px solid var(--line); box-shadow: inset 0 -2px 0 var(--acc3) }
      [data-theme="command"] .brand { letter-spacing: .08em; text-transform: uppercase; font-size: 13px }
      [data-theme="command"] .brand span { letter-spacing: .04em; text-transform: none }
      [data-theme="command"] label, [data-theme="command"] .card h2, [data-theme="command"] nav button, [data-theme="command"] .theme-pick { text-transform: uppercase; letter-spacing: .07em }
      [data-theme="command"] label { font-size: 10.5px; color: var(--mut) }
      [data-theme="command"] .card h2 { font-size: 13px; color: var(--acc) }
      [data-theme="command"] nav button { font-size: 12px }
      [data-theme="command"] .card, [data-theme="command"] .oc { border-color: var(--line2) }
      [data-theme="command"] .card { border-top: 2px solid var(--acc) }
      [data-theme="command"] .oh { background: var(--bg2); color: var(--acc) }
      [data-theme="command"] .pk, [data-theme="command"] .count, [data-theme="command"] .ids, [data-theme="command"] .oh .n, [data-theme="command"] .cal-g button, [data-theme="command"] .tp-g button { font-family: Consolas, "Cascadia Mono", monospace; font-variant-numeric: tabular-nums }
      [data-theme="command"] .tabs button.on { background: var(--acc2); color: #fff; box-shadow: inset 0 -2px 0 var(--acc) }

      /* ===== Cyberpunk theme: near-black, neon cyan and magenta, soft glow ===== */
      [data-theme="cyber"] {
        color-scheme: dark;
        --bg: #07060d; --bg2: #0e0c19; --card: #110f1e; --raised: #171429; --ink: #eceaff; --ink2: #cfcaf2; --mut: #a19cc9;
        --line: #2a2347; --line2: #3b3166; --acc: #00e5ff; --acc-ink: #04020a; --acc2: rgba(0, 229, 255, .12); --acc3: rgba(0, 229, 255, .26);
        --pink: #ff2bd6; --ok: #3dffa8; --okb: rgba(61, 255, 168, .1); --err: #ff5c8a; --errb: rgba(255, 92, 138, .12); --warn: #ffe14d; --warnb: rgba(255, 225, 77, .09); --warnl: rgba(255, 225, 77, .35);
        --hdr: rgba(7, 6, 13, .92); --EW: #ff3d6e; --SC: #ffb800; --OW: #b26bff; --r: 10px; --r2: 7px;
        --sh: 0 0 0 1px rgba(0, 229, 255, .08), 0 0 22px rgba(0, 229, 255, .06); --sh2: 0 0 0 1px var(--line2), 0 18px 50px rgba(0, 0, 0, .7); --focus: 0 0 0 2px var(--acc), 0 0 14px rgba(0, 229, 255, .45);
      }
      [data-theme="cyber"] body { background: linear-gradient(rgba(255, 43, 214, .035) 1px, transparent 1px) 0 0/100% 4px, radial-gradient(900px 420px at 85% -120px, rgba(255, 43, 214, .14), transparent 70%), radial-gradient(900px 420px at 10% -120px, rgba(0, 229, 255, .12), transparent 70%), var(--bg) }
      [data-theme="cyber"] header { border-bottom: 1px solid var(--line2); box-shadow: 0 1px 0 rgba(255, 43, 214, .35), 0 6px 24px rgba(255, 43, 214, .08) }
      [data-theme="cyber"] .brand { color: var(--acc); text-shadow: 0 0 10px rgba(0, 229, 255, .55); letter-spacing: .06em; text-transform: uppercase; font-size: 14px }
      [data-theme="cyber"] .brand span { color: var(--pink); text-shadow: none; text-transform: none; letter-spacing: .02em }
      [data-theme="cyber"] .card, [data-theme="cyber"] .oc { border-color: var(--line2) }
      [data-theme="cyber"] .card { box-shadow: 0 0 0 1px rgba(0, 229, 255, .1), 0 0 30px rgba(0, 229, 255, .05), inset 0 1px 0 rgba(255, 43, 214, .25) }
      [data-theme="cyber"] .card h2 { color: var(--acc); text-shadow: 0 0 8px rgba(0, 229, 255, .45); letter-spacing: .03em }
      [data-theme="cyber"] label { color: var(--ink2) }
      [data-theme="cyber"] .oh { background: var(--bg2); color: var(--pink) }
      [data-theme="cyber"] .tabs { border-color: var(--line2) }
      [data-theme="cyber"] .tabs button.on { background: rgba(255, 43, 214, .14); color: #fff; box-shadow: 0 0 0 1px var(--pink), 0 0 14px rgba(255, 43, 214, .45) }
      [data-theme="cyber"] nav button.tool.on { color: var(--acc); background: var(--acc2); box-shadow: 0 0 0 1px var(--acc3) }
      [data-theme="cyber"] .btn:not(.ghost) { box-shadow: 0 0 12px rgba(0, 229, 255, .45) }
      [data-theme="cyber"] .btn.ghost { box-shadow: inset 0 0 0 1px var(--acc3) }
      [data-theme="cyber"] .segc button.on { background: rgba(255, 43, 214, .14); color: #fff; box-shadow: 0 0 0 1px var(--pink) }
      [data-theme="cyber"] input:focus, [data-theme="cyber"] select:focus, [data-theme="cyber"] textarea:focus { border-color: var(--acc) }
      [data-theme="cyber"] .pill.ok { box-shadow: 0 0 10px rgba(61, 255, 168, .25) }
      [data-theme="cyber"] .pill.err { box-shadow: 0 0 10px rgba(255, 92, 138, .3) }
      [data-theme="cyber"] .pk, [data-theme="cyber"] .count, [data-theme="cyber"] .ids { font-variant-numeric: tabular-nums }
      [data-theme="cyber"] ::selection { background: rgba(255, 43, 214, .35) }


        /* ===== GTA 6 theme: Vice City sunset. Deep purple night, hot pink and sunset orange, ocean teal, bold italic headings ===== */
        [data-theme="gta"] {
          color-scheme: dark;
          --bg: #140a24; --bg2: #1c1030; --card: #1e1233; --raised: #26173f; --ink: #fff3f8; --ink2: #f2d9e8; --mut: #c4a5c9;
          --line: #3a2357; --line2: #52306f; --acc: #ff4fa3; --acc-ink: #1a0a1e; --acc2: rgba(255, 79, 163, .14); --acc3: rgba(255, 79, 163, .3);
          --sun: #ff9a3c; --sea: #2de2e6;
          --ok: #4cf0b0; --okb: rgba(76, 240, 176, .12); --err: #ff6b7d; --errb: rgba(255, 107, 125, .14); --warn: #ffc857; --warnb: rgba(255, 200, 87, .1); --warnl: rgba(255, 200, 87, .38);
          --hdr: rgba(20, 10, 36, .9); --EW: #ff5470; --SC: #ff9a3c; --OW: #b88cff; --r: 12px; --r2: 8px;
          --sh: 0 2px 10px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 79, 163, .06); --sh2: 0 18px 50px rgba(0, 0, 0, .65); --focus: 0 0 0 3px rgba(45, 226, 230, .4);
        }
        [data-theme="gta"] body { background: radial-gradient(1100px 380px at 50% -140px, rgba(255, 154, 60, .32), transparent 70%), radial-gradient(900px 420px at 100% 0, rgba(255, 79, 163, .2), transparent 70%), linear-gradient(180deg, #1d0d33 0%, #140a24 45%, #0d0a22 100%); background-attachment: fixed }
        [data-theme="gta"] header { border-bottom: 0; box-shadow: 0 2px 0 0 transparent; background-image: linear-gradient(90deg, rgba(255, 154, 60, .16), rgba(255, 79, 163, .16) 50%, rgba(45, 226, 230, .12)) }
        [data-theme="gta"] header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: linear-gradient(90deg, var(--sun), var(--acc) 50%, var(--sea)) }
        [data-theme="gta"] .brand { font-style: italic; font-weight: 800; font-size: 16px; letter-spacing: .01em; background: linear-gradient(90deg, var(--sun), var(--acc)); -webkit-background-clip: text; background-clip: text; color: transparent }
        [data-theme="gta"] .brand span { font-style: normal; font-weight: 600; color: var(--sea); -webkit-text-fill-color: var(--sea) }
        [data-theme="gta"] .card { border-color: var(--line2); background: linear-gradient(90deg, var(--sun), var(--acc) 50%, var(--sea)) top / 100% 3px no-repeat, var(--card) }
        [data-theme="gta"] .card h2 { font-style: italic; font-weight: 800; font-size: 17px; color: var(--sun); letter-spacing: .005em }
        [data-theme="gta"] .oc { border-color: var(--line2) }
        [data-theme="gta"] .oh { background: linear-gradient(90deg, rgba(255, 79, 163, .14), rgba(45, 226, 230, .06)); color: var(--sea) }
        [data-theme="gta"] .tabs { border-color: var(--line2) }
        [data-theme="gta"] .tabs button.on { background: linear-gradient(135deg, var(--sun), var(--acc)); color: #1a0a1e; box-shadow: 0 4px 14px rgba(255, 79, 163, .35) }
        [data-theme="gta"] nav button.tool.on { color: var(--sea); background: rgba(45, 226, 230, .12) }
        [data-theme="gta"] .btn:not(.ghost) { background: linear-gradient(135deg, var(--sun), var(--acc)); color: #1a0a1e; box-shadow: 0 4px 14px rgba(255, 79, 163, .3) }
        [data-theme="gta"] .btn.ghost { color: var(--sea); background: rgba(45, 226, 230, .1) }
        [data-theme="gta"] .btn.ghost:hover { background: rgba(45, 226, 230, .2) }
        [data-theme="gta"] .segc button.on { background: var(--acc); color: #1a0a1e }
        [data-theme="gta"] .picker button.on, [data-theme="gta"] .cal-g button.sel, [data-theme="gta"] .tp-g button.sel, [data-theme="gta"] .tp-ap button.sel { background: var(--acc); color: #1a0a1e; border-color: var(--acc) }
        [data-theme="gta"] .count { background: rgba(45, 226, 230, .12); color: var(--sea) }
        [data-theme="gta"] label { color: var(--ink2) }
        [data-theme="gta"] ::selection { background: rgba(255, 154, 60, .4) }

      [data-theme="cyber"], [data-theme="cyber"] body { cursor: var(--cur) }

      [data-theme="cyber"] .btn:disabled { cursor: not-allowed }
    /* ===== Layout ===== */
    main { display: grid; grid-template-columns: minmax(380px, 1fr) minmax(380px, 1fr); gap: 22px; padding: 22px 24px 40px; max-width: 1500px; margin: auto }
    @media(max-width:960px) { main { grid-template-columns: 1fr } .out { position: static !important } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); padding: 22px }
    .card h2 { margin: 0 0 4px; font-size: 16px; font-weight: 650; letter-spacing: -.005em }
    .sub { color: var(--mut); font-size: 13px; margin: 0 0 18px; max-width: 62ch }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px }
    @media(max-width:560px) { .grid { grid-template-columns: 1fr } }
      .full { grid-column: 1/-1 }
      /* Fields side by side always line up: if one label wraps, both boxes still sit on the same line */
      .grid > div:not(.full) { display: flex; flex-direction: column; justify-content: flex-end; min-width: 0 }
      .grid > div:not(.full) > label:first-child { flex: none }
    /* A tickbox on its own sits level with the middle of the box beside it */
    .grid > div:not(.full):has(> .chk:only-child) { padding-bottom: 9px }

    /* ===== Fields ===== */
    label { display: block; font-size: 12px; font-weight: 600; color: var(--ink2); margin-bottom: 5px }
    input, select, textarea {
      width: 100%; padding: 8px 11px; border: 1px solid var(--line2); border-radius: var(--r2);
      font: inherit; background: var(--card); color: var(--ink); transition: border-color .15s, box-shadow .15s
    }
    input::placeholder, textarea::placeholder { color: var(--mut); opacity: .8 }
    input:hover, select:hover, textarea:hover { border-color: var(--mut) }

      const when = (multi ? 'on ' + fmtDateList(ds) : s.d1 && s.d2 && s.d1 !== s.d2 ? 'from ' + fmtDate(s.d1) + ' to ' + fmtDate(s.d2) : 'on ' + fmtDate(s.d1)) + ', ' + timeText + (s.excl ? ' (excluding ' + s.excl + ')' : '');
      let o;
      if (t === 'holding') o = { title: title(''), body: 'There ' + be(c) + ' ' + wa(c) + ' ' + place + ' which may cause delays, cancellations or detours. Updates to follow.', pid: null };
      else if (t === 'unplanned' || t === 'update') {
        const upd = t === 'update', ong = upd && !POINT_EVENTS.includes(c);
        const cz = ong ? ongoingC(c) : wa(c);
        let b;
        if (roads.length) b = R + ' will ' + (upd ? 'continue to detour' : 'detour') + ' through ' + listAnd(roads) + ' because of ' + cz + ' ' + place + '. This may cause delays.';
        else { b = 'There ' + be(c) + ' ' + cz + ' ' + place + '. This may cause delays.'; if (eff === 'Detour') flags.push('Title says Detour but no detour roads are entered.'); }
        b += stops.length ? tail : '\nNo stops will be skipped.';
        o = { title: title(upd ? 'UPDATE ' : ''), body: b, pid: stops.length ? 'Buses will not stop here due to ' + wa(c) + '. Use Journey Planner to find other stops nearby.' : null };
      }
      else if (t === 'resolved') o = { title: 'RESOLVED ' + R + ' - ' + street + ', ' + sub, body: 'The ' + c + ' ' + place + ' ' + has(c) + ' been resolved. Buses will now return to their normal routes.', pid: null };
      else if (t === 'planned' || t === 'plannedUpdate') {
        const ov = overnight ? 'overnight ' : '';
        const ovc = ov ? (ART[c] ? 'an ' : '') + ov + c : wa(c);
        let b = t === 'planned' ? 'There ' + be(c) + ' ' + ovc + ' ' + place + ' ' + when + '.'
          : 'Dates have changed for the ' + ov + c + ' ' + place + '. Works will now take place ' + when + '.';
        if (roads.length) b += ' ' + R + ' will detour through ' + listAnd(roads) + (t === 'planned' ? ', which may cause delays.' : '.');
        else if (eff === 'Detour') flags.push('Title says Detour but no detour roads are entered.');
        b += tail;
        o = {
          title: title(t === 'plannedUpdate' ? 'UPDATE ' : ''), body: b,
          pid: stops.length ? 'Buses will not stop here due to ' + ovc + ' ' + when + '. Use Journey Planner to find other stops nearby.' + (temp ? ' A temporary stop has been set up ' + atPlace(temp) + '.' : '') : null
        };
        if (overnight) flags.push('Times cross midnight, so "overnight" was added.');
        if (overnight && multi) flags.push('Overnight works: each date listed should be the night the works start.');
        if (!multi && s.d1 && s.d2 && s.d2 < s.d1) flags.push('The end date is before the start date.');
        if (somOvernight) flags.push('Only some of the times cross midnight, so "overnight" was not added. Check the wording reads correctly.');
        if (samePeriods) flags.push('Weekday and weekend times are the same, so they are written once. Use "Every day" instead.');
        if (days !== 'all' && !multi && s.d1) {
          const cnt = { wk: 0, we: 0 }, [y, m, d] = s.d1.split('-').map(Number), end = s.d2 || s.d1;
          for (let i = 0; i < 400; i++) { const dt = new Date(Date.UTC(y, m - 1, d + i)), iso = dt.toISOString().slice(0, 10); if (iso > end) break; const w = dt.getUTCDay(); w === 0 || w === 6 ? cnt.we++ : cnt.wk++; }

    }

    // ===== FERRY ENGINE =====
    function parseSailings(txt) {
      const rows = [], unknown = [];
      (txt || '').split('\n').forEach(l => {
        const m = l.match(/(\d{1,2})[:.](\d{2})\s*([ap]\.?m\.?)?\s*([A-Za-z]+)\s*[-–>]+\s*([A-Za-z]+)/i); if (!m) return;
        let h = +m[1]; const ap = (m[3] || '').toLowerCase().replace(/\./g, '');
        if (ap === 'pm' && h < 12) h += 12; if (ap === 'am' && h === 12) h = 0;
        const f = FERRY_CODES[m[4].toUpperCase()] || m[4], to = FERRY_CODES[m[5].toUpperCase()] || m[5];
        [m[4], m[5]].forEach(x => { if (!FERRY_CODES[x.toUpperCase()]) unknown.push(x); });
        rows.push({ mins: h * 60 + +m[2], t: String(h).padStart(2, '0') + ':' + m[2], from: f, to });
      });
      rows.sort((a, b) => a.mins - b.mins);

    }
    function ferryOut(s) {
      s = fullFields(s, ['pier', 'loc', 'a', 'b', 'times', 'when']);
      const flags = [], c = s.cause || 'ferry breakdown', CTA = 'Check Live Departures and digital screens at ferry terminals before you travel.';
      if (s.tpl === 'cancel') {
        const { rows, unknown } = parseSailings(s.sailings);
        if (unknown.length) flags.push('Unknown terminal code(s): ' + [...new Set(unknown)].join(', ') + '. Write the terminal name in full.');
        const auto = rows[0] ? [rows[0].from, rows[0].to].find(x => x !== 'Downtown') : '';
        if (s.route && auto && !rows.every(r => r.from === s.route || r.to === s.route)) flags.push('Some sailings don\'t match the selected route (' + s.route + '). Check the route.');
        const route = s.route || auto || '[ROUTE]';
        const g = []; rows.forEach(r => { const k = r.from + ' to ' + r.to; let x = g.find(y => y.k === k); if (!x) g.push(x = { k, t: [] }); x.t.push(fmtTime(r.t)); });
        if (!rows.length) flags.push('Paste sailings like "07:40 BCH-DFT", one per line.');
        return { title: route + ' Ferry cancellations', body: 'The following ' + route + ' ferry services will be cancelled because of ' + wa(c) + ':\n' + (g.length ? g.map(x => '• ' + x.k + ': ' + listAnd(x.t)).join('\n') : '• [ORIGIN] to [DESTINATION]: [TIME]') + '\n' + CTA + ' Use Journey Planner to find other travel options.', pid: null, pa: null, flags };
      }
      if (s.tpl === 'weather') {
        const r = s.route ? s.route + ' ' : '';
        return { title: (s.route ? s.route + ' Ferry' : 'Ferry') + ' delays and cancellations', body: cap(c) + ' may cause delays or cancellations to ' + r + 'ferries' + (s.when ? ' ' + s.when : '') + '. Check Live Departures before you travel to see if your ferry will be affected.', pid: null, pa: null, flags };
      }
      if (s.tpl === 'pier') {
        const n = s.pier || '[PIER NAME]', rng = s.d1 ? ' ' + shortRange(s.d1, s.d2) : '';
        if (c === 'maintenance') flags.push('Pier closure examples say "maintenance works".');
        return { title: n + ' Ferry Pier closed' + rng, body: (s.route || '[ROUTE]') + ' ferry services will not stop at ' + n + (s.d1 ? (s.d2 && s.d2 !== s.d1 ? ' from ' + fmtDate(s.d1) + ' to ' + fmtDate(s.d2) : ' on ' + fmtDate(s.d1)) : '') + ' because of ' + wa(c) + '.\nUse Journey Planner for alternative transport options.', pid: null, pa: null, flags };
      }
      if (s.tpl === 'downtown') {
        const rows = (s.piers || '').split('\n').filter(l => l.includes('|')).map(l => l.split('|').map(x => x.trim()));
        if (!rows.length) flags.push('Add pier rows: Pier | start | end | route | moves to pier');
        return { title: 'Downtown Ferry Terminal – Pier Closures', body: 'The following Downtown Ferry Terminal piers will be closed on ' + fmtDate(s.d1) + ' because of ' + wa(c) + ':\n' + rows.map(r => cap(r[0]) + ' – closed between ' + fmtTime(r[1]) + ' and ' + fmtTime(r[2]) + '. ' + (r[3] || '[ROUTE]') + ' ferry services will depart from ' + (r[4] || '[PIER]') + ' during this period.').join('\n') + '\n' + CTA, pid: null, pa: null, flags };
      }
      if (s.tpl === 'cruise') {

      }
    }

    // ===== FACILITIES ENGINE =====

    // ===== CHECKER =====

      { re: /\b(P1|DISR\d+|FM\d+|job (no|number))\b/i, lvl: 'err', msg: 'Remove internal job or record numbers' },
      { re: /\b(Downer|barge|crane|verbal(ly)? (authority|advised)|balise|blacked out|anticlockwise|via NMT|Day of Ops|DoO|AOR|until the site is safe)\b/i, lvl: 'err', msg: 'Internal detail' },

    // ===== CHECK WORDING: whole-message checker with safe fixes =====

    const SPELL = { britomart: 'Waitematā', waitemata: 'Waitematā', waihototiu: 'Waihorotiu', maungawahu: 'Maungawhau', 'karang-a-hape': 'Karanga-a-Hape', takaanini: 'Takanini', paerata: 'Paerātā', orakei: 'Ōrākei', otahuhu: 'Ōtāhuhu', ranui: 'Rānui', 'te papapa': 'Te Pāpapa', ngakoroa: 'Ngākōroa', 'taku tai': 'Takutai' };

      "Alerts use 'because of' ('due to' is for PIDs and PAs)": h => kc(h, 'because of'),
      "Use 'end at', not 'terminate'": h => { const r = { terminate: 'end', terminates: 'ends', terminated: 'ended', terminating: 'ending' }[h.toLowerCase()]; return r ? kc(h, r) : null; },

      'Write names in full: Road, Avenue, Drive, Mount and so on': h => { const f = fullNames(h); return f !== h ? f : null; },

      '24-hour time: use am/pm': h => { const H = +h.split(':')[0]; return (H >= 13 || H === 0 || /^0/.test(h)) ? fmtTime(h.padStart(5, '0')) : null; },

      "Use 'Downtown'": () => 'Downtown',
      "Use 'an' before a vowel sound": h => h[0] === 'A' ? 'An ' : 'an ',
      "Use 'a' before this cause": h => h[0] === 'A' ? 'A ' : 'a ',
      'This cause takes no article': h => { const w = h.replace(/^an?\s+/i, ''); return /^A/.test(h) ? w[0].toUpperCase() + w.slice(1) : w; },
      'Plural cause: use "are" / "have"': h => h.replace(/\bis\b/, 'are').replace(/\bhas been\b/, 'have been'),
      'Don\'t use "ongoing" for a one-off event': h => h.replace(/^ongoing /i, ''),
      'Repeated word': h => h.split(' ')[0],
      'Spacing or punctuation glitch': h => / {2,}/.test(h) ? ' ' : h.trim(),
    };
    // Extra wording rules used only by Check wording (builders never produce these).
    const CHECK_EXTRA = [
      { re: /\bwill skip\b/i, lvl: 'err', msg: "Use 'will not stop at', not 'skip'", fix: h => kc(h, 'will not stop at') },
      { re: /\bwon'?t stop at\b/i, lvl: 'err', msg: "Write 'will not stop at' in full", fix: h => kc(h, 'will not stop at') },
      { re: /\bcanceled\b/i, lvl: 'err', msg: "Use the NZ spelling 'cancelled'", fix: h => kc(h, 'cancelled') },
      { re: /^(Update|Resolved|Reminder)\b/, ch: ['title'], lvl: 'err', msg: 'Write UPDATE, RESOLVED or REMINDER in capitals', fix: h => h.toUpperCase() },
      { re: /\.$/, ch: ['title'], lvl: 'warn', msg: "Titles don't end with a full stop", fix: () => '' },
      { re: /\bbecause of\b/i, ch: ['pid'], mode: 'bus', lvl: 'warn', msg: "Bus PIDs use 'due to'", fix: h => kc(h, 'due to') },
      { re: /!/, lvl: 'warn', msg: 'Avoid exclamation marks', fix: null },
      { re: /\bASAP\b|\betc\b\.?/i, lvl: 'warn', msg: "Avoid shorthand like 'ASAP' and 'etc'", fix: null },
    ];
    // Template-shape checks for a whole part. Each returns a list of { s, e, hit, fix }.

        for (const stage of ['initial', 'update', 'resolved']) for (const k of Object.keys(PRESETS)) { n++; chk('train ' + k + ' ' + stage + ' ' + c, trainOut({ ...T0, ...P(k), stage, cause: c }), 'train'); }
        for (const tpl of ['holding', 'unplanned', 'update', 'resolved', 'planned', 'plannedUpdate']) for (const roads of ['A Road, B Road', '']) for (const dateMode of ['range', 'dates']) for (const showAlt of [false, true]) for (const allDay of [false, true]) { n++; chk('bus ' + tpl + ' ' + c, busOut({ ...BUS0, tpl, dateMode, showAlt, allDay, dates: ['2026-10-08', '2026-10-12'], routes: '70, 75', street: 'X Road', suburb: 'Y', cause: c, roads, stops: '1234 - Foo\n2345 - Bar > 2346 - Baz', temp: 'outside 5 X Road', d1: '2026-10-12', d2: '2026-10-13', t1: '21:00', t2: '05:00' }), 'bus'); }
        for (const tpl of ['cancel', 'pier', 'replace', 'downtown']) { n++; chk('ferry ' + tpl + ' ' + c, ferryOut({ tpl, cause: c, sailings: '07:40 BCH-DFT', pier: 'Bayswater', route: 'Bayswater', a: 'Bayswater', b: 'Downtown', mode: 'buses', d1: '2026-10-12', piers: 'Pier 1 | 10:00 | 14:00 | Devonport | Pier 2' }), 'ferry'); }
      }
      for (const c of ['roadworks', 'event', 'maintenance']) for (const tpl of ['planned', 'plannedUpdate']) for (const days of ['weekdays', 'weekends', 'split']) for (const weAllDay of [false, true]) { n++; chk('bus days ' + tpl + ' ' + days, busOut({ ...BUS0, tpl, days, weAllDay, routes: '70', street: 'X Road', suburb: 'Y', cause: c, stops: '1234 - Foo', d1: '2026-11-16', d2: '2026-11-29', t1: '21:00', t2: '05:00', weT1: '07:00', weT2: '18:00' }), 'bus'); }
      for (const c of ['fog', 'high winds', 'severe weather', 'weather conditions']) { n++; chk('ferry weather ' + c, ferryOut({ tpl: 'weather', cause: c, route: 'Devonport', when: 'today' }), 'ferry'); }
      for (const tpl of ['down', 'fixed']) for (const asset of ['Lift', 'Escalator', 'Access point']) { n++; chk('fac ' + tpl, facOut({ tpl, asset, station: 'Waitematā Station', detail: 'on Platform 2', near: 'Parnell' }), 'facilities'); }
      // every block type, both lines and single line
      for (const type of ['detour', 'direct', 'shortened', 'skip', 'notrun', 'shuttle', 'freq', 'platform']) for (const line of ['EW', 'ALL']) {
        n++;
        chk('train block ' + type, trainOut({ ...T0, lines: ['EW', 'SC'], cause: 'track issue', a: 'Newmarket', blocks: [{ type, line, via: 'Parnell', at: 'Newmarket', from: 'Ōtāhuhu', to: 'Newmarket', end: 'Newmarket', a: 'Ōtāhuhu', b: 'Newmarket', min: '15', freq: '15', st: 'Newmarket', n: '2', m: '1', skips: ['Remuera', 'Greenlane'] }] }), 'train');
      }
      return { count: n, bad };
    }
    /*ENGINE-END*/
  </script>
  <script>
    // ================= UI =================
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const opts = (arr, v, blank) => (blank !== undefined ? `<option value="">${blank}</option>` : '') + arr.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}"${val === v ? ' selected' : ''}>${esc(lab)}</option>`; }).join('');
    const causeOpts = v => opts(CAUSES.map(c => c[0]), v);
    const F = (lab, html, cls = '') => `<div class="${cls}"><label>${lab}</label>${html}</div>`;
    const SDAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], SMON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const shortD = d => { const [y, m, dd] = d.split('-').map(Number); return SDAY[new Date(Date.UTC(y, m - 1, dd)).getUTCDay()] + ' ' + dd + ' ' + SMON[m - 1]; };
    const pickBtn = (kind, m, k, label, empty, k2 = '') => `<button type="button" class="pk${label ? '' : ' empty'}" data-pk="${kind}" data-m="${m}" data-pkk="${k}" data-pkk2="${k2}">${esc(label || empty)}<span class="ic ${kind === 'time' ? 'clock' : 'cal'}"></span></button>`;
    const dateBtn = (m, k, v) => pickBtn('single', m, k, v ? shortD(v) + ' ' + v.slice(0, 4) : '', 'Select date');
    const timeBtn = (m, k, v) => pickBtn('time', m, k, v ? fmtTime(v) : '', 'Select time');
    const rangeBtn = (m, s) => pickBtn('range', m, 'd1', s.d1 ? shortD(s.d1) + (s.d2 && s.d2 !== s.d1 ? '  –  ' + shortD(s.d2) : '') : '', 'Select start and end dates', 'd2');
    const inp = (m, k, v, ph = '', type = 'text') => type === 'date' ? dateBtn(m, k, v) : type === 'time' ? timeBtn(m, k, v) : `<input type="${type}" data-m="${m}" data-k="${k}" value="${esc(v)}" placeholder="${esc(ph)}">`;
    const sel = (m, k, inner) => `<select data-m="${m}" data-k="${k}">${inner}</select>`;
    const ta = (m, k, v, ph = '') => `<textarea data-m="${m}" data-k="${k}" placeholder="${esc(ph)}">${esc(v)}</textarea>`;
    const ck = (m, k, v, lab) => `<label class="chk"><input type="checkbox" data-m="${m}" data-k="${k}"${v ? ' checked' : ''}>${lab}</label>`;
    function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 1600); }
    const store = {
      get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
      del(k) { try { localStorage.removeItem(k); } catch (e) { } }
    };
    function copy(t) {
      const fb = () => { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); toast('Copied'); };
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Copied'), fb); else fb();
    }

    const ST = {
      train: { ...T0, lines: ['EW'], cause: 'track issue', a: 'Henderson', blocks: [] },
      bus: { ...BUS0 },
      ferry: { tpl: 'cancel', cause: 'ferry breakdown', route: '', sailings: '', when: '', pier: '', d1: '', d2: '', piers: '', loc: '', t1: '', t2: '', t3: '', t4: '', reminder: false, mode: 'buses', a: '', b: '', times: '' },
      fac: { tpl: 'down', asset: 'Lift', station: '', tloc: '', detail: '', near: '', alt: '', cause: 'technical issue', subject: '', impact: '' },
      check: { text: '', mode: 'auto', treat: 'auto', raw: '' }
    };
    let TAB = 'train', LAST = null, CUR_PRESET = '', EDITING = null;   // EDITING = { id, mode, at } while a saved message is open
    const MODE_LABEL = { train: 'Train', bus: 'Bus', ferry: 'Ferry', fac: 'Facilities' };
    const clone = o => JSON.parse(JSON.stringify(o));
    const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    function savedList() { return store.get('ncs-log', []).map(x => x.id ? x : { ...x, id: newId() }); }

    // ---------- TRAIN ----------
    const BLOCK_TYPES = [['detour', 'Detour'], ['direct', 'Run directly'], ['shortened', 'Shortened (end at)'], ['skip', 'Stations not served'], ['notrun', 'Will not run between'], ['shuttle', 'Shuttle train'], ['freq', 'Frequency'], ['platform', 'Platform change']];
    function pool(s, b) { if (b.line && b.line !== 'ALL') return LINES[b.line].st; const out = []; s.lines.forEach(k => LINES[k].st.forEach(x => out.includes(x) || out.push(x))); return out; }
    function picker(i, b, s) {
      const sk = b.skips || [];
      return `<div class="picker">${pool(s, b).map(x => { const n = sk.indexOf(x); return `<button data-pick="${i}" data-st="${esc(x)}" class="${n > -1 ? 'on' : ''}">${n > -1 ? `<b>${n + 1}</b>` : ''}${esc(x)}</button>`; }).join('')}</div>
  <div class="row" style="margin-top:6px"><button class="btn ghost sm" data-bact="rev" data-i="${i}">↕ Reverse order</button><button class="btn ghost sm" data-bact="clr" data-i="${i}">Clear</button><span class="note">Click in reading order. Only stations on the customer's <b>original</b> route.</span></div>`;
    }
    function blockHtml(s, b, i) {
      const m = 'blk' + i, lineSel = sel(m, 'line', (s.lines.length > 1 ? opts([['ALL', 'All selected lines']], b.line) : '') + opts(s.lines.map(k => [k, LINES[k].name]), b.line));
      const L = LINES[b.line], destSel = L ? sel(m, 'dest', opts(L.ends.map(e => [e, 'Only trains to ' + e]), b.dest || '', 'Both directions')) : '';
      const st = k => sel(m, k, opts(ALL_STATIONS, b[k] || '', '—'));
      let f = F('Line', lineSel);
      switch (b.type) {
        case 'detour': f += (L ? F('Direction', destSel) : '<div></div>') + F('Detour at (optional)', st('at')) + F('Through', inp(m, 'via', b.via || '', 'e.g. Parnell station')) + F('Every X minutes (optional)', inp(m, 'freq', b.freq || '', '15')) + F('Will not stop at', picker(i, b, s), 'full'); break;
        case 'direct': f += (L ? F('Direction', destSel) : '<div></div>') + F('From', st('from')) + F('To', st('to')) + F('Every X minutes (optional)', inp(m, 'freq', b.freq || '')) + `<div>${ck(m, 'only', b.only, 'Add "only" (direct running only)')}</div>` + F('Will not stop at', picker(i, b, s), 'full'); break;
        case 'shortened': f += F('End at', st('end')) + F('Every X minutes (optional)', inp(m, 'freq', b.freq || '')) + F('Will not continue to', picker(i, b, s), 'full'); break;
        case 'skip': f += F('Will not stop at', picker(i, b, s), 'full'); break;
        case 'notrun': f += '<div></div>' + F('Not between', st('a')) + F('and', st('b')) + F('Still runs between (optional)', st('c')) + F('and', st('d')); break;
        case 'shuttle': f = F('Shuttle between', st('a')) + F('and', st('b')) + F('Stopping at (list every station)', picker(i, b, s), 'full'); break;
        case 'freq': f += F('Every X minutes', inp(m, 'min', b.min || '', '15')) + `<div>${ck(m, 'about', b.about, 'Use "about" (not exact)')}</div>`; break;
        case 'platform': f = F('Station', st('st')) + F('New platform', inp(m, 'n', b.n || '')) + F('Instead of platform', inp(m, 'm', b.m || '')); break;
      }
      const lab = BLOCK_TYPES.find(t => t[0] === b.type)[1];
      return `<div class="block ${b.line && b.line !== 'ALL' ? b.line : ''}"><div class="bhead">${i + 1}. ${lab}<button class="btn ghost sm" data-bact="del" data-i="${i}">Remove</button></div><div class="grid">${f}</div></div>`;
    }
    function trainForm() {
      const s = ST.train, m = 'train', std = s.format === 'standard', btw = std && s.locType === 'between';
      return `<h2>Train disruption</h2><p class="sub">Pick the lines, cause and location, then add only the impacts that apply. Confirm stopping patterns with Day of Ops before publishing.</p>
  <div class="grid">
    ${F('Start from a common scenario (optional)', `<select id="preset"><option value="">Start from scratch</option>${[...new Set(Object.values(PRESETS).map(p => p.group))].map(g => `<optgroup label="${esc(g)}">${Object.entries(PRESETS).filter(([, p]) => p.group === g).map(([k, p]) => `<option value="${k}"${k === CUR_PRESET ? ' selected' : ''}>${esc(p.label)}</option>`).join('')}</optgroup>`).join('')}</select>${CUR_PRESET ? `<p class="note">${esc(PRESETS[CUR_PRESET].desc)} Pre-filled from the CRL templates; check every field against the live situation.</p>` : '<p class="note">Pick a scenario to pre-fill the form, then adjust it.</p>'}`, 'full')}
    ${F('Message type', sel(m, 'format', opts([['standard', 'Standard alert'], ['single', 'One station closed'], ['allstop', 'All train services stopped']], s.format)))}
    ${std ? F('Stage', sel(m, 'stage', opts([['initial', 'Initial'], ['update', 'UPDATE'], ['resolved', 'RESOLVED']], s.stage))) : '<div></div>'}
    ${F('Lines', `<div class="seg">${Object.keys(LINES).map(k => `<button class="lchip ${k} ${s.lines.includes(k) ? 'on' : ''}" data-line="${k}">${LINES[k].name}</button>`).join('')}</div>`, 'full')}
    ${F('Cause (approved list)', sel(m, 'cause', causeOpts(s.cause)))}
    ${std ? F('Location', sel(m, 'locType', opts([['at', 'At a station'], ['between', 'Between two stations']], s.locType))) : '<div></div>'}
    ${F(btw ? 'From station' : 'Station', sel(m, 'a', opts(ALL_STATIONS, s.a, '—')))}
    ${btw ? F('To station', sel(m, 'b', opts(ALL_STATIONS, s.b, '—'))) : '<div></div>'}
    ${btw ? `<div>${ck(m, 'stSuffix', s.stSuffix, 'Add "stations" after the pair')}</div>` + F('PID says "near"', sel(m, 'pidNear', opts([['A', 'From station'], ['B', 'To station']], s.pidNear))) : ''}
    ${std ? F('Title effect', sel(m, 'effect', opts([['auto', 'Auto (' + autoEffect(s) + ')'], 'delays', 'delays and cancellations', 'delays and detours', 'delays and route changes'], s.effect))) : ''}
    ${std ? `<div style="align-self:end">${ck(m, 'tickets', s.tickets, 'Buses will accept train tickets (confirmed)')}${s.stage === 'update' ? ck(m, 'ongoing', s.ongoing, 'Ongoing (continuing cause)') : ''}</div>` : ''}
  </div>
  ${std && s.stage !== 'resolved' ? `<h2 style="margin-top:18px">Impacts</h2><div id="blocks">${s.blocks.map((b, i) => blockHtml(s, b, i)).join('')}</div>
  <div class="row" style="margin-top:10px"><select id="newBlock" style="width:auto">${opts(BLOCK_TYPES)}</select><button class="btn" id="addBlock">+ Add impact</button></div>
  <p class="note">No impacts gives a "delays and cancellations" alert. With 3+ impacts, start a new sentence and repeat the line name.</p>` : ''}`;
    }

    // ---------- BUS ----------
    const BUS_EFFECT = { holding: 'Delays', unplanned: 'Detour', update: 'Detour', resolved: 'Detour', planned: 'Detour', plannedUpdate: 'Detour' };
    function busForm() {
      const s = ST.bus, m = 'bus', planned = s.tpl.startsWith('planned'), stopsOn = s.tpl !== 'holding' && s.tpl !== 'resolved';
      return `<h2>Bus disruption</h2><p class="sub">One closed stop per line: <code>6818 - Stop name</code>. Add a temporary stop with <code>&gt; Temporary Bus Stop at 257 Robertson Rd</code>, or an alternative with <code>&gt; 6820 - Other stop</code>. Abbreviations (Rd, St, Ave, Mt) are written in full automatically.</p>
  <div class="grid">
    ${F('Template', sel(m, 'tpl', opts([['holding', 'Holding'], ['unplanned', 'Unplanned detour'], ['update', 'Unplanned UPDATE'], ['resolved', 'RESOLVED'], ['planned', 'Planned roadworks or event'], ['plannedUpdate', 'Planned UPDATE (dates changed)']], s.tpl)))}
    ${s.tpl !== 'resolved' ? F('Title effect', sel(m, 'effect', opts(['Detour', 'Delays', 'Cancellations', 'Delays and cancellations', 'Route changes', 'Will not stop at', 'Stops skipped', 'Stop closed'], s.effect))) : '<div></div>'}
    ${F('Routes', inp(m, 'routes', s.routes, 'e.g. 70, 75 or OUT'))}
    ${F('Cause', sel(m, 'cause', planned ? opts(['roadworks', 'event', 'maintenance'], s.cause) : causeOpts(s.cause)))}
    ${F('Road, suburb', inp(m, 'street', s.street, 'e.g. Great South Rd, Papatoetoe'))}
    ${F('Suburb', inp(m, 'suburb', s.suburb, 'Filled in from the comma'))}
    ${F('On / at', sel(m, 'prep', opts(['on', 'at'], s.prep)))}<div></div>
    ${stopsOn ? F('Detour through (comma-separated; first, main middle and last road)', inp(m, 'roads', s.roads, 'Swallow Road, Rowandale Avenue, Browns Road'), 'full') : ''}
    ${planned ? F('When', `<div class="segc"><button type="button" data-dmode="range" class="${s.dateMode !== 'dates' ? 'on' : ''}">Date range</button><button type="button" data-dmode="dates" class="${s.dateMode === 'dates' ? 'on' : ''}">Specific dates</button></div>`
        + (s.dateMode === 'dates'
          ? `<div style="margin-top:8px">${pickBtn('multi', m, 'dates', '', (s.dates || []).length ? 'Add or remove dates' : 'Select dates')}</div>${(s.dates || []).length ? `<div class="chips">${[...s.dates].sort().map(d => `<span class="chip">${shortD(d)}<button type="button" data-rmdate="${d}" aria-label="Remove">×</button></span>`).join('')}</div>` : ''}<p class="note">Pick each day the works happen, e.g. 8 and 12 October only.</p>`
          : `<div style="margin-top:8px">${rangeBtn(m, s)}</div><p class="note">Pick the first day, then the last day. Pick one day twice for a single date.</p>`), 'full')
          + (s.dateMode !== 'dates' ? F('Days', `<div class="segc segc-wrap">${[['all', 'Every day'], ['weekdays', 'Weekdays only'], ['weekends', 'Weekends only'], ['split', 'Weekdays and weekends']].map(([k, l]) => `<button type="button" data-days="${k}" class="${(s.days || 'all') === k ? 'on' : ''}">${l}</button>`).join('')}</div>${(s.days || 'all') === 'split' ? '<p class="note">Set different times for weekdays (Monday to Friday) and weekends (Saturday and Sunday).</p>' : ''}`, 'full') : '')
          + (s.dateMode !== 'dates' && s.days === 'split'
            ? timeBlock('Weekdays', 'Monday to Friday', 'allDay', 't1', 't2', s.allDay) + timeBlock('Weekends', 'Saturday and Sunday', 'weAllDay', 'weT1', 'weT2', s.weAllDay)
            : `<div class="full">${ck(m, 'allDay', s.allDay, 'All day (says "at all times", no time range)')}</div>`
              + (s.allDay ? '' : F('Start time', inp(m, 't1', s.t1, '', 'time')) + F('End time', inp(m, 't2', s.t2, '', 'time'))))
          + F('Excluding (optional)', inp(m, 'excl', s.excl, 'e.g. public holidays'), 'full') : ''}
    ${stopsOn ? F('Stops not served' + '<span id="stopCount"></span>', ta(m, 'stops', s.stops, '6818 - Russell Road/Swallow Road\n6503 - Jacueline Place > Temporary Bus Stop at 257 Robertson Road\n6829 - Name > 6831 - Name') + `<div style="margin-top:8px">${ck(m, 'showAlt', s.showAlt, 'Show alternative stops (e.g. "Use Stop 3048 - Finchley Road")')}</div>`, 'full') + F('Shared temporary stop for all listed stops (optional)', inp(m, 'temp', s.temp, 'e.g. outside 12 Main Road'), 'full') : ''}
    ${planned ? F('Quick fill from a roadworks table row (paste)', `<textarea id="busPaste" placeholder="Paste the Stop Closed / Redirected To / Services / dates / times rows"></textarea><button class="btn ghost sm" id="busParse" style="margin-top:6px">Fill fields</button>`, 'full') : ''}
  </div>`;
    }
    // One set of times inside the planned works form (used for the weekday and weekend periods).
    function timeBlock(title, sub, adKey, k1, k2, ad) {
      const m = 'bus', s = ST.bus;
      return `<div class="full period"><div class="period-h"><b>${title}</b><span>${sub}</span><span class="period-ad">${ck(m, adKey, ad, 'All day')}</span></div>
        ${ad ? '<p class="note" style="margin:0">Says "at all times".</p>' : `<div class="grid">${F('Start time', inp(m, k1, s[k1], '', 'time'))}${F('End time', inp(m, k2, s[k2], '', 'time'))}</div>`}</div>`;
    }
    function parseRoadworks(t) {
      const s = ST.bus, found = [];
      const dates = [...t.matchAll(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/g)].map(m => `${m[3].length === 2 ? '20' + m[3] : m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`);
      if (/24\s*\/\s*7|all times|all day|24 hours/i.test(t)) { s.allDay = true; found.push('all day (at all times)'); }
      if (/weekday/i.test(t) && /weekend/i.test(t)) { s.days = 'split'; found.push('weekdays and weekends (set each set of times)'); }
      else if (/weekdays? only|mon(day)?\s*(-|to)\s*fri(day)?/i.test(t)) { s.days = 'weekdays'; found.push('weekdays only'); }
      else if (/weekends? only|sat(urday)?\s*(-|to|and|&)\s*sun(day)?/i.test(t)) { s.days = 'weekends'; found.push('weekends only'); }
      if (dates[0]) { s.dateMode = 'range'; s.d1 = dates[0]; s.d2 = dates[1] || dates[0]; found.push('dates (as a range: switch to Specific dates if the works are not every day)'); }
      const tm = t.match(/(\d{1,2})[:.](\d{2})\s*([ap]m)?\s*(?:–|-|to)\s*(\d{1,2})[:.](\d{2})\s*([ap]m)?/i);
      if (tm) {
        const h24 = (h, ap) => { h = +h; ap = (ap || '').toLowerCase(); if (ap === 'pm' && h < 12) h += 12; if (ap === 'am' && h === 12) h = 0; return String(h).padStart(2, '0'); };
        s.t1 = h24(tm[1], tm[3]) + ':' + tm[2]; s.t2 = h24(tm[4], tm[6]) + ':' + tm[5]; found.push('times');
      }
      const st = [];
      t.split('\n').filter(l => /^\s*\d{3,5}/.test(l)).forEach(l => { const c = l.split('\t').map(x => x.trim()).filter(Boolean); if (c[0]) st.push(c[0] + (c[1] ? ' > ' + c[1] : '')); if (c[2] && !s.routes) s.routes = c[2]; });
      if (st.length) { s.stops = st.join('\n'); found.push(st.length + ' stop row(s)'); }
      toast(found.length ? 'Filled: ' + found.join(', ') + '. Check them.' : 'Nothing recognised');
    }

    // ---------- FERRY ----------
    const FERRY_CAUSE = { cancel: 'ferry breakdown', weather: 'fog', pier: 'maintenance works', downtown: 'maintenance works', cruise: 'cruise ship activity', replace: 'ferry breakdown' };
    function ferryForm() {
      const s = ST.ferry, m = 'ferry', t = s.tpl, routeSel = sel(m, 'route', opts(FERRY_ROUTES, s.route, t === 'cancel' ? 'Auto-detect from codes' : '— Not specified —'));
      let f = '';
      if (t === 'cancel') f = F('Route', routeSel) + F('Cause', sel(m, 'cause', causeOpts(s.cause))) + F('Cancelled sailings (one per line, raw is fine)', ta(m, 'sailings', s.sailings, '07:40 BCH-DFT\n5:30pm DFT-BCH'), 'full');
      if (t === 'weather') f = F('Route', routeSel) + F('Weather', sel(m, 'cause', opts(['fog', 'high winds', 'severe weather', 'weather conditions', 'high tides', 'low tides', 'flooding'], s.cause))) + F('When (optional)', inp(m, 'when', s.when, 'this morning / today'), 'full');
      if (t === 'pier') f = F('Pier name', inp(m, 'pier', s.pier, 'e.g. Bayswater')) + F('Route', routeSel) + F('Cause', sel(m, 'cause', causeOpts(s.cause))) + '<div></div>' + F('Dates (optional)', rangeBtn(m, s) + (s.d1 ? '<button type="button" class="linkbtn" data-clrrange="ferry">Clear dates</button>' : ''), 'full');
      if (t === 'downtown') f = F('Date', inp(m, 'd1', s.d1, '', 'date')) + F('Cause', sel(m, 'cause', causeOpts(s.cause))) + F('Pier rows: Pier | start | end | route | moves to', ta(m, 'piers', s.piers, 'Pier 1 | 10:00 | 14:00 | Devonport | Pier 2'), 'full');

    // ---------- OUTPUT ----------
    function compute() {
      if (TAB === 'train') return trainOut(ST.train);
      if (TAB === 'bus') return busOut(ST.bus);
      if (TAB === 'ferry') return ferryOut(ST.ferry);

    function hl(text, hits) { let h = esc(text); hits.filter(x => x.hit && x.hit.trim()).forEach(x => { const e = esc(x.hit); h = h.split(e).join(`<span class="mark">${e}</span>`); }); return h; }

      const o = compute(); LAST = o; const mode = TAB === 'fac' ? 'facilities' : TAB;

      }).join('');
      let idCard = '';
      if (TAB === 'bus' && o.stopIds && o.stopIds.length) {
        const n = o.stopIds.length, sep = ST.bus.idSep || 'comma';
        LAST.ids = o.stopIds.join(sep === 'line' ? '\n' : sep === 'space' ? ' ' : ', ');
        idCard = `<div class="oc internal"><div class="oh">Stop numbers<span class="count"><b>${n}</b> stop${n > 1 ? 's' : ''} affected</span><span class="n">Internal use only</span><div class="segc">${[['comma', 'Comma'], ['line', 'New line'], ['space', 'Space']].map(([k, l]) => `<button type="button" data-idsep="${k}" class="${sep === k ? 'on' : ''}">${l}</button>`).join('')}</div><button class="btn ghost sm" data-copy="ids">Copy</button></div><div class="ids">${esc(LAST.ids)}</div></div>`;
      }
      const sc = document.getElementById('stopCount'); if (sc && TAB === 'bus') { const n = (o.stopIds || []).length; sc.className = n ? 'count' : ''; sc.innerHTML = n ? `<b>${n}</b> stop${n > 1 ? 's' : ''}` : ''; }
      out.innerHTML = `<div class="row"><span class="pill ${errs ? 'err' : 'ok'}">${errs ? errs + ' issue(s) to fix before copying' : 'Ready to copy'}</span><span style="margin-left:auto"></span>${EDITING && EDITING.mode === TAB ? '<button class="btn ghost sm" id="saveNew">Save as new</button><button class="btn ghost sm" id="save">Update saved</button>' : '<button class="btn ghost sm" id="save">Save</button>'}<button class="btn sm" id="copyAll">Copy all</button></div>
  ${o.flags && o.flags.length ? `<div class="flags">${o.flags.map(f => `<div>⚑ ${esc(f)}</div>`).join('')}</div>` : ''}${cards}${idCard}`;
    }
    // ---------- CHECK WORDING ----------
    let CHECK_RES = null, CHECK_FIXED = '';
    const visHit = h => h.trim() ? h : h.replace(/ /g, '·').replace(/\n/g, '↵');
    function markPart(text, p, issues) {
      const list = issues.filter(i => i.end > i.start && i.start >= p.start && i.end <= p.end).sort((a, b) => a.start - b.start || b.end - a.end);
      let out = '', pos = p.start;
      for (const i of list) { if (i.start < pos) continue; out += esc(text.slice(pos, i.start)) + `<mark class="cm ${i.lvl}" data-iss="${i.id}" title="${esc(i.msg)}">${esc(text.slice(i.start, i.end))}</mark>`; pos = i.end; }
      return out + esc(text.slice(pos, p.end));
    }
    function issueItem(i) {
      const change = i.hit ? `<div class="iss-change"><span class="was">${esc(visHit(i.hit))}</span>${i.fix !== null ? ` <span class="arrow">→</span> <span class="now">${i.fix === '' ? '(remove)' : esc(i.fix.trim() ? i.fix : visHit(i.fix))}</span>` : ''}</div>`
        : i.fix ? `<div class="iss-change">Add <span class="now">${esc(i.fix.trim())}</span></div>` : '';
      return `<li class="iss ${i.lvl}" data-goto="${i.id}"><div class="iss-top"><span class="iss-dot"></span><span class="iss-msg">${esc(i.msg)}</span><span class="iss-part">${CHECK_KIND[i.kind]}</span></div>${change}
        <div class="iss-acts">${i.fix !== null ? `<button type="button" class="btn sm" data-chkfix="${i.id}">Fix</button>` : '<span class="note" style="margin:0">Needs your decision</span>'}${i.end > i.start ? `<button type="button" class="btn ghost sm" data-chkshow="${i.id}">Show</button>` : ''}</div></li>`;
    }
    function renderCheck() {
      const out = $('#out'), s = ST.check, text = s.text || '';
      const ro = $('#rawOut'); if (ro) ro.innerHTML = s.raw ? mapRawCause(s.raw).map(c => `<span class="pill ok">${esc(wa(c))}</span>`).join('') + '<span class="note" style="margin:0">Confirm before use. Anything else needs approval.</span>' : '';
      const ab = document.querySelector('[data-chkmode=auto]');
      if (!text.trim()) {
        CHECK_RES = null; CHECK_FIXED = ''; if (ab) ab.textContent = 'Auto';
        out.innerHTML = `<div class="oc"><div class="oh">Results</div><div class="ot chk-empty"><b>Nothing to check yet</b><p class="note">Paste a message on the left, or <button type="button" class="linkbtn" id="chkExample2">try an example</button>.</p>
          <ul class="chk-tips"><li>Each part gets its own rules. "due to" is right in a PID but not in an alert.</li><li>Problems are highlighted in the text. Click one to jump to it.</li><li><b>Fix</b> corrects one issue, <b>Fix all</b> corrects every issue the rules are sure about, and <b>Copy fixed text</b> copies the corrected version without changing what you pasted.</li></ul></div></div>`;
        return;
      }
      const r = checkText(text, { mode: s.mode, treat: s.treat }); CHECK_RES = r;
      CHECK_FIXED = fixAll(text, { mode: r.mode, treat: s.treat });
      if (ab) ab.textContent = s.mode === 'auto' ? 'Auto · ' + CHECK_MODE[r.mode] : 'Auto';
      const errs = r.issues.filter(i => i.lvl === 'err'), warns = r.issues.filter(i => i.lvl === 'warn'), fixable = r.issues.filter(i => i.fix !== null).length, changed = CHECK_FIXED !== text;
      const head = errs.length ? `<span class="pill err">${errs.length} must fix</span>` : `<span class="pill ok">${warns.length ? 'No errors' : 'All checks passed'}</span>`;

      const parts = r.parts.map((p, idx) => {

        return `<div class="oc" id="part${idx}"><div class="oh">${CHECK_KIND[p.kind]}${n ? `<span class="count">${n} issue${n > 1 ? 's' : ''}</span>` : '<span class="count okc">OK</span>'}${len}<button type="button" class="btn ghost sm" style="margin-left:auto" data-chkcopy="${idx}">Copy</button></div><div class="ot ${p.kind}">${markPart(text, p, r.issues)}</div></div>`;
      }).join('');

      out.innerHTML = `<div class="row chk-bar">${head}<span class="chk-meta">${CHECK_MODE[r.mode]} message · ${r.parts.map(p => CHECK_KIND[p.kind]).join(', ') || 'no parts found'}</span><span style="margin-left:auto"></span>
          <button type="button" class="btn ghost sm" id="chkCopyFixed" ${changed ? '' : 'disabled'}>Copy fixed text</button><button type="button" class="btn sm" id="chkFixAll" ${fixable ? '' : 'disabled'}>Fix all${fixable ? ' (' + fixable + ')' : ''}</button></div>
        <div class="chk-stats">${stat('err', errs.length, 'Must fix')}${stat('warn', warns.length, 'Should check')}${stat('ok', r.passed.length, 'Checks passed')}</div>
        ${parts}
        <div class="oc"><div class="oh">Issues</div>
          ${r.issues.length ? group('Must fix', errs, 'err') + group('Should check', warns, 'warn') : '<div class="ot"><span class="pill ok">No issues found</span> <span class="note">This text follows the template rules for a ' + CHECK_MODE[r.mode].toLowerCase() + ' message.</span></div>'}
          <details class="chk-pass"><summary>${r.passed.length} checks passed</summary><ul>${r.passed.map(n => `<li>${esc(n)}</li>`).join('')}</ul></details></div>`;
    }
    function setCheckText(t, msg) { ST.check.text = t; const el = $('#chkIn'); if (el) el.value = t; renderOut(); if (msg) toast(msg); }
    function flash(el) { if (!el) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    document.addEventListener('click', e => {
      if (TAB !== 'check') return;
      const mk = e.target.closest('mark.cm');
      if (mk) { const li = document.querySelector(`.iss[data-goto="${mk.dataset.iss}"]`); if (li) { li.scrollIntoView({ block: 'center', behavior: 'smooth' }); flash(li); } return; }
      const b = e.target.closest('button');
      if (b && b.dataset.chkmode) { ST.check.mode = b.dataset.chkmode; document.querySelectorAll('[data-chkmode]').forEach(x => x.classList.toggle('on', x === b)); renderOut(); return; }
      if (b && (b.id === 'chkExample' || b.id === 'chkExample2')) { setCheckText(CHECK_EXAMPLE, 'Example loaded'); return; }
      if (b && b.id === 'chkClear') { setCheckText('', ''); const el = $('#chkIn'); if (el) el.focus(); return; }
      if (b && b.id === 'chkFixAll') { const n = CHECK_RES ? CHECK_RES.issues.filter(i => i.fix !== null).length : 0; setCheckText(CHECK_FIXED, 'Fixed ' + n + ' issue' + (n === 1 ? '' : 's')); return; }
      if (b && b.id === 'chkCopyFixed') { copy(CHECK_FIXED); return; }
      if (b && b.dataset.chkcopy !== undefined) { const p = CHECK_RES && CHECK_RES.parts[+b.dataset.chkcopy]; if (p) copy(p.text); return; }
      const id = b ? (b.dataset.chkfix || b.dataset.chkshow) : (e.target.closest('.iss') || {}).dataset?.goto;
      if (!id || !CHECK_RES) return;
      const i = CHECK_RES.issues.find(x => x.id === id); if (!i) return;
      if (b && b.dataset.chkfix) { setCheckText(applyFixes(ST.check.text, [i]), 'Fixed'); return; }
      const mark = document.querySelector(`mark.cm[data-iss="${id}"]`);
      if (mark) { mark.scrollIntoView({ block: 'center', behavior: 'smooth' }); flash(mark); }
      else { const pi = CHECK_RES.parts.findIndex(p => i.start >= p.start && i.start <= p.end); const card = $('#part' + pi); if (card) { card.scrollIntoView({ block: 'center', behavior: 'smooth' }); flash(card); } }
      const ta = $('#chkIn'); if (ta && i.end > i.start) { ta.focus({ preventScroll: true }); ta.setSelectionRange(i.start, i.end); }
    });
    function allText(o) { return [o.title, o.body, o.pid, ...(o.pids || []).map(p => p.label + ': ' + p.text)].filter(Boolean).join('\n\n'); }

    // ---------- RENDER + EVENTS ----------
    const FORMS = { train: trainForm, bus: busForm, ferry: ferryForm, fac: facForm, check: checkForm, tests: testsForm, log: logForm };
    function render() { $('#form').innerHTML = editBanner() + FORMS[TAB](); renderOut(); }
    const RERENDER = new Set(['format', 'stage', 'locType', 'tpl', 'effect', 'allDay', 'weAllDay']);

    // ===== Date and time popovers =====
    let POP = null;
    const iso = (y, m, d) => y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const todayIso = () => { const t = new Date(); return iso(t.getFullYear(), t.getMonth() + 1, t.getDate()); };
    function popVals() { const S = ST[POP.m]; return { S, v: S[POP.k], v2: POP.k2 ? S[POP.k2] : '' }; }
    function calHtml() {
      const { S, v, v2 } = popVals(), [Y, M] = POP.view.split('-').map(Number);
      const first = new Date(Y, M - 1, 1), lead = (first.getDay() + 6) % 7, days = new Date(Y, M, 0).getDate(), today = todayIso();
      const multi = POP.kind === 'multi', sel = multi ? (S.dates || []) : [v, v2].filter(Boolean);
      let g = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(d => `<div class="wd">${d}</div>`).join('') + '<div></div>'.repeat(lead);
      for (let d = 1; d <= days; d++) {
        const x = iso(Y, M, d), c = [];
        if (x === today) c.push('today'); if (x < today) c.push('past');
        if (sel.includes(x)) c.push('sel');
        if (POP.kind === 'range' && v && v2 && x > v && x < v2) c.push('in');
        g += `<button type="button" class="${c.join(' ')}" data-day="${x}">${d}</button>`;
      }
      let hint = '';
      if (POP.kind === 'range') hint = !v || (v && v2) ? 'Pick the first day' : 'Now pick the last day';
      if (multi) hint = sel.length ? sel.length + (sel.length > 1 ? ' dates' : ' date') + ' selected' : 'Pick each day';
      return `<div class="cal-h"><button type="button" data-calnav="-1" aria-label="Previous month">‹</button><span>${MONTHS[M - 1]} ${Y}</span><button type="button" data-calnav="1" aria-label="Next month">›</button></div>
    <div class="cal-g">${g}</div>
    <div class="pop-f"><span class="hint">${hint}</span><span><button type="button" class="linkbtn" data-popclear="1">Clear</button>&nbsp;&nbsp;<button type="button" class="btn sm" data-popdone="1">Done</button></span></div>`;
    }
    function timeHtml() {
      const { v } = popVals(); let h = null, mi = null, ap = 'am';
      if (v) { const [H, Mi] = v.split(':').map(Number); ap = H >= 12 ? 'pm' : 'am'; h = H % 12 || 12; mi = Mi; }
      const hrs = Array.from({ length: 12 }, (_, i) => i + 1).map(x => `<button type="button" class="${x === h ? 'sel' : ''}" data-th="${x}">${x}</button>`).join('');
      const mins = Array.from({ length: 12 }, (_, i) => i * 5).map(x => `<button type="button" class="${x === mi ? 'sel' : ''}" data-tm="${x}">:${String(x).padStart(2, '0')}</button>`).join('');
      const quick = ['06:00', '07:00', '09:00', '09:30', '15:00', '15:30', '19:00', '20:00', '21:00', '22:00', '05:00'].map(q => `<button type="button" data-tq="${q}">${fmtTime(q)}</button>`).join('');
      return `<input class="tp-in" id="tpType" placeholder="Type a time, e.g. 7:30pm or 19:30" value="${v ? fmtTime(v) : ''}">
    <div class="tp-l">Hour</div><div class="tp-g">${hrs}</div>
    <div class="tp-l">Minutes</div><div class="tp-g">${mins}</div>
    <div class="tp-l">Period</div><div class="tp-ap"><button type="button" class="${ap === 'am' ? 'sel' : ''}" data-tap="am">am</button><button type="button" class="${ap === 'pm' ? 'sel' : ''}" data-tap="pm">pm</button></div>
    <div class="tp-l">Common times</div><div class="tp-q">${quick}</div>
    <div class="pop-f"><button type="button" class="linkbtn" data-popclear="1">Clear</button><button type="button" class="btn sm" data-popdone="1">Done</button></div>`;
    }
    function setTime(h12, mi, ap) { const H = (h12 % 12) + (ap === 'pm' ? 12 : 0); ST[POP.m][POP.k] = String(H).padStart(2, '0') + ':' + String(mi).padStart(2, '0'); }
    function parseTyped(t) {
      const m = t.trim().toLowerCase().replace(/\s+/g, '').match(/^(\d{1,2})(?:[:.](\d{2}))?(am|pm)?$/); if (!m) return null;
      let h = +m[1], mi = +(m[2] || 0); if (mi > 59) return null;
      if (m[3]) { if (h < 1 || h > 12) return null; if (m[3] === 'pm' && h < 12) h += 12; if (m[3] === 'am' && h === 12) h = 0; } else if (h > 23) return null;
      return String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0');
    }
    function drawPop() {
      let el = document.getElementById('pop');
      if (!POP) { if (el) el.remove(); document.querySelectorAll('.pk.active').forEach(b => b.classList.remove('active')); return; }
      if (!el) { el = document.createElement('div'); el.id = 'pop'; el.className = 'pop'; document.body.appendChild(el); }
      el.innerHTML = POP.kind === 'time' ? timeHtml() : calHtml();
      const a = document.querySelector(`[data-pk][data-m="${POP.m}"][data-pkk="${POP.k}"]`);
      document.querySelectorAll('.pk.active').forEach(b => b.classList.remove('active'));

        const h = el.offsetHeight, below = window.innerHeight - r.bottom, above = r.top - 60;
        el.style.top = ((below < h + 12 && above > below) ? r.top + window.scrollY - h - 6 : r.bottom + window.scrollY + 6) + 'px';

    function closePop() { POP = null; drawPop(); }
    function afterPick() { render(); drawPop(); }
    document.addEventListener('mousedown', e => { if (POP && !e.target.closest('#pop') && !e.target.closest('[data-pk]')) closePop(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && POP) closePop();

    });
    window.addEventListener('resize', () => POP && drawPop());
    document.addEventListener('click', e => {
      const pb = e.target.closest('button');
      if (pb && pb.dataset.pk) {
        const { pk, m, pkk, pkk2 } = pb.dataset;
        if (POP && POP.m === m && POP.k === pkk) { closePop(); return; }
        const cur = ST[m][pkk], base = (Array.isArray(cur) ? [...cur].sort()[0] : cur) || todayIso();
        POP = { kind: pk, m, k: pkk, k2: pkk2, view: base.slice(0, 7) }; drawPop(); return;
      }
      if (pb && pb.closest('#pop')) {
        const d = pb.dataset, S = POP && ST[POP.m];
        if (d.calnav) { let [Y, M] = POP.view.split('-').map(Number); M += +d.calnav; if (M < 1) { M = 12; Y--; } if (M > 12) { M = 1; Y++; } POP.view = Y + '-' + String(M).padStart(2, '0'); drawPop(); return; }
        if (d.day) {
          const x = d.day;
          if (POP.kind === 'single') { S[POP.k] = x; render(); closePop(); return; }
          if (POP.kind === 'multi') { const a = S.dates || []; S.dates = a.includes(x) ? a.filter(y => y !== x) : [...a, x].sort(); afterPick(); return; }
          if (POP.kind === 'range') {
            const a = S[POP.k], b = S[POP.k2];
            if (!a || b || x < a) { S[POP.k] = x; S[POP.k2] = ''; afterPick(); return; }
            S[POP.k2] = x; render(); closePop(); return;
          }
        }
        if (d.th) { const { v } = popVals(); const [H, Mi] = (v || '00:00').split(':').map(Number); setTime(+d.th, v ? Mi : 0, v ? (H >= 12 ? 'pm' : 'am') : (+d.th >= 5 && +d.th <= 11 ? 'am' : 'pm')); afterPick(); return; }
        if (d.tm !== undefined) { const { v } = popVals(); const [H] = (v || '12:00').split(':').map(Number); setTime(H % 12 || 12, +d.tm, H >= 12 ? 'pm' : 'am'); afterPick(); return; }
        if (d.tap) { const { v } = popVals(); const [H, Mi] = (v || '12:00').split(':').map(Number); setTime(H % 12 || 12, Mi, d.tap); afterPick(); return; }
        if (d.tq) { S[POP.k] = d.tq; render(); closePop(); return; }
        if (d.popclear) { if (POP.kind === 'multi') S.dates = []; else { S[POP.k] = ''; if (POP.k2) S[POP.k2] = ''; } afterPick(); return; }
        if (d.popdone) { closePop(); return; }
        return;
      }
      if (pb && pb.dataset.idsep) { ST.bus.idSep = pb.dataset.idsep; renderOut(); return; }
      if (pb && pb.dataset.days) { ST.bus.days = pb.dataset.days; render(); return; }
      if (pb && pb.dataset.dmode) { ST.bus.dateMode = pb.dataset.dmode; render(); return; }
      if (pb && pb.dataset.rmdate) { ST.bus.dates = ST.bus.dates.filter(x => x !== pb.dataset.rmdate); render(); return; }
      if (pb && pb.dataset.clrrange) { ST[pb.dataset.clrrange].d1 = ''; ST[pb.dataset.clrrange].d2 = ''; render(); return; }
    });
    document.addEventListener('click', e => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.dataset.tab) { closePop(); TAB = t.dataset.tab; document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t.dataset.tab)); render(); return; }
      const s = ST.train;
      if (t.dataset.line) {
        const k = t.dataset.line; s.lines = s.lines.includes(k) ? s.lines.filter(x => x !== k) : Object.keys(LINES).filter(x => x === k || s.lines.includes(x));
        s.blocks.forEach(b => { if (b.line !== 'ALL' && !s.lines.includes(b.line)) { b.line = s.lines[0] || 'EW'; b.dest = ''; } if (b.line === 'ALL' && s.lines.length < 2) b.line = s.lines[0] || 'EW'; }); render(); return;
      }
      if (t.id === 'addBlock') { const type = $('#newBlock').value; s.blocks.push({ type, line: s.lines.length > 1 && ['freq', 'shortened'].includes(type) ? 'ALL' : (s.lines[0] || 'EW'), skips: [] }); render(); return; }
      if (t.dataset.bact) { const i = +t.dataset.i, b = s.blocks[i]; if (t.dataset.bact === 'del') s.blocks.splice(i, 1); if (t.dataset.bact === 'rev') b.skips.reverse(); if (t.dataset.bact === 'clr') b.skips = []; render(); return; }
      if (t.dataset.pick !== undefined) { const b = s.blocks[+t.dataset.pick], x = t.dataset.st; b.skips = b.skips || []; b.skips = b.skips.includes(x) ? b.skips.filter(y => y !== x) : [...b.skips, x]; render(); return; }
      if (t.dataset.copy) { if (LAST && LAST[t.dataset.copy]) copy(LAST[t.dataset.copy]); return; }
      if (t.id === 'copyAll') { if (LAST) copy(allText(LAST)); return; }
      if (t.id === 'save' || t.id === 'saveNew') {
        if (!LAST) return;
        const L = savedList(), now = new Date().toLocaleString('en-NZ'), entry = { mode: TAB, title: LAST.title, text: allText(LAST), state: clone(ST[TAB]), preset: TAB === 'train' ? CUR_PRESET : '' };
        const i = t.id === 'save' && EDITING && EDITING.mode === TAB ? L.findIndex(x => x.id === EDITING.id) : -1;
        if (i > -1) { L[i] = { ...L[i], ...entry, edited: now }; L.unshift(L.splice(i, 1)[0]); }
        else { const id = newId(); L.unshift({ id, at: now, ...entry }); EDITING = { id, mode: TAB, at: now }; }
        if (!store.set('ncs-log', L.slice(0, 50))) { toast('Could not save: this browser blocks local storage'); return; }
        toast(i > -1 ? 'Saved message updated' : 'Saved'); render(); return;
      }
      if (t.dataset.logcopy) { const x = savedList().find(y => y.id === t.dataset.logcopy); if (x) copy(x.text); return; }
      if (t.dataset.logedit) {
        const x = savedList().find(y => y.id === t.dataset.logedit); if (!x || !x.state || !ST[x.mode]) return;
        closePop(); ST[x.mode] = clone(x.state); if (x.mode === 'train') CUR_PRESET = x.preset || '';
        EDITING = { id: x.id, mode: x.mode, at: x.at }; TAB = x.mode;
        document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === TAB));
        render(); window.scrollTo(0, 0); toast('Opened for editing'); return;
      }
      if (t.dataset.logdel) { const x = savedList().find(y => y.id === t.dataset.logdel); if (!x || !confirm('Delete "' + x.title + '"?')) return; store.set('ncs-log', savedList().filter(y => y.id !== x.id)); if (EDITING && EDITING.id === x.id) EDITING = null; render(); return; }
      if (t.id === 'stopEdit') { EDITING = null; render(); return; }
      if (t.id === 'logClear') { if (!confirm('Clear all saved messages in this browser?')) return; store.del('ncs-log'); EDITING = null; render(); return; }

    });
    function onField(e) {
      const el = e.target;
      if (el.id === 'logq') { ST.logq = el.value; const pos = el.selectionStart; render(); const q = $('#logq'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } return; }
      if (el.id === 'preset') { CUR_PRESET = el.value; if (!el.value) ST.train = { ...T0, lines: ['EW'], cause: 'track issue', blocks: [] }; if (el.value) ST.train = JSON.parse(JSON.stringify({ ...T0, ...PRESETS[el.value].st })); render(); return; }

      ST[m][k] = v;

      if (m === 'bus' && k === 'tpl') { ST.bus.effect = BUS_EFFECT[v]; if (v.startsWith('planned') && !['roadworks', 'event', 'maintenance'].includes(ST.bus.cause)) ST.bus.cause = 'roadworks'; }
      if (m === 'ferry' && k === 'tpl') ST.ferry.cause = FERRY_CAUSE[v];

    document.addEventListener('change', e => { if (e.target.tagName === 'SELECT' || e.target.type === 'checkbox') onField(e); });
    // When you leave the road or suburb field, tidy it: "Great South Rd, Papatoetoe" -> "Great South Road" + "Papatoetoe"
    document.addEventListener('focusout', e => {
      const el = e.target; if (el.dataset.m !== 'bus' || !['street', 'suburb'].includes(el.dataset.k)) return;

      const st = document.querySelector('[data-m="bus"][data-k="street"]'), su = document.querySelector('[data-m="bus"][data-k="suburb"]');
      if (st) st.value = p.road; if (su) su.value = p.suburb; renderOut();
    });
      // ===== Theme (Light, Dark, Command centre, Cyberpunk, GTA 6) =====
      (() => {
        const sel = $('#themeSel'); sel.value = document.documentElement.getAttribute('data-theme') || 'light';
        sel.addEventListener('change', () => { document.documentElement.setAttribute('data-theme', sel.value); try { localStorage.setItem('ncs-theme', sel.value); } catch (e) { } closePop(); });
      })();
    // Self-check runs silently on every load. Staff only see something if a rule change has broken the wording.

    // It runs just after the page appears, so opening the tool is instant.
    setTimeout(() => {
